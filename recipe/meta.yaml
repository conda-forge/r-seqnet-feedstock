{% set version = "1.1.4" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-seqnet
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/SeqNet_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/SeqNet/SeqNet_{{ version }}.tar.gz
  sha256: 772ade061ee4e574acf2b8733aafe1801b877d2617a271ca41bde8ec80283012

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}              # [not win]
    - {{ stdlib("c") }}                # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib("m2w64_c") }}          # [win]
    - {{ compiler('cxx') }}            # [not win]
    - {{ compiler('m2w64_cxx') }}      # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-rcpp
    - r-rdpack
    - r-fitdistrplus
    - r-ggplot2
    - r-igraph
    - r-mvtnorm
    - r-purrr
    - r-rlang
    - r-tibble
  run:
    - r-base
    - r-rcpp
    - r-rdpack
    - r-fitdistrplus
    - r-ggplot2
    - r-igraph
    - r-mvtnorm
    - r-purrr
    - r-rlang
    - r-tibble

test:
  commands:
    - $R -e "library('SeqNet')"           # [not win]
    - "\"%R%\" -e \"library('SeqNet')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=SeqNet
  license: GPL-2.0-or-later
  summary: Methods to generate random gene-gene association networks and simulate RNA-seq data from them, as described in Grimes and Datta (2021) <doi:10.18637/jss.v098.i12>. Includes functions to generate random networks of any size and perturb them to obtain differential networks. Network objects are built from 
    individual, overlapping modules that represent pathways. The resulting network has various topological properties that are characteristic of gene regulatory networks. RNA-seq data can be generated such that the association among gene expression profiles reflect the underlying network. A reference RNA-seq dataset 
    can be provided to model realistic marginal distributions. Plotting functions are available to visualize a network, compare two networks, and compare the expression of two genes across multiple networks.
  license_family: GPL3
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2'
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r
